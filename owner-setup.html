<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>NOVA MARKET — تفعيل المالك</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#101827;color:#eef2f7;font-family:system-ui,-apple-system,Segoe UI,sans-serif;padding:20px}
    main{width:min(100%,480px);background:#182438;border:1px solid #34445c;border-radius:18px;padding:28px;box-shadow:0 18px 60px #0005}
    h1{margin:0 0 10px;font-size:25px}
    p{color:#c4cfdd;line-height:1.7}
    .muted{font-size:14px;color:#9eacc0}
    button{width:100%;border:0;border-radius:10px;padding:14px 18px;background:#d8a84e;color:#18202c;font-weight:700;font-size:16px;cursor:pointer;margin-top:14px;touch-action:manipulation}
    button.secondary{background:#33445c;color:#eef2f7}
    button:disabled{opacity:.55;cursor:wait}
    #status{margin-top:18px;padding:12px;border-radius:10px;background:#111c2d;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.7}
    .ok{color:#9de3b1}.err{color:#ffaaa8}
    [hidden]{display:none!important}
  </style>
</head>
<body>
<main>
  <h1>NOVA MARKET</h1>
  <p>إعداد حساب مالك المشروع</p>
  <p class="muted">سيُرسل رابط دخول مؤقت إلى بريد المالك المعتمد فقط. لا توجد خانة لكلمة المرور، ولا يتم طلب أي مفتاح سري.</p>
  <button id="send" type="button">إرسال رابط الدخول إلى بريد المالك</button>
  <button id="logout" class="secondary" type="button">تسجيل الخروج</button>
  <div id="status" role="status" aria-live="polite">جاهز. اضغط إرسال رابط الدخول للمتابعة.</div>
</main>
<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.86.0';

  const SUPABASE_URL = 'https://jjymmdnqawzgxihawpnh.supabase.co';
  const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_jm2qpSeEIAQznhLo4iWzmg_uj3IveX6';
  const OWNER_EMAIL = 'boumazaramzi8@gmail.com';
  const REDIRECT_URL = 'https://boumazaramzi15-prog.github.io/NOVA-MARKET/owner-setup.html';
  const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
    auth: { flowType: 'pkce', persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
  });

  const sendButton = document.getElementById('send');
  const logoutButton = document.getElementById('logout');
  const status = document.getElementById('status');
  const show = (message, kind='') => { status.textContent = message; status.className = kind; };
  const busy = (value, button) => { button.disabled = value; };

  async function sendMagicLink() {
    busy(true, sendButton);
    show('جارٍ إرسال رابط الدخول إلى البريد المعتمد…');
    try {
      const { error } = await supabase.auth.signInWithOtp({
        email: OWNER_EMAIL,
        options: { shouldCreateUser: false, emailRedirectTo: REDIRECT_URL }
      });
      if (error) {
        show('لم يُرسل الرابط: ' + error.message + '\nتحقق من إضافة رابط الصفحة إلى قائمة Redirect URLs في إعدادات Auth.', 'err');
      } else {
        show('تم طلب رابط دخول مؤقت إلى ' + OWNER_EMAIL + '. افتح أحدث رسالة واضغط الرابط من هذا الجهاز.');
      }
    } catch (error) {
      show('حدث خطأ أثناء طلب الرابط: ' + (error?.message || 'خطأ غير معروف'), 'err');
    } finally {
      busy(false, sendButton);
    }
  }

  async function signOutOwner() {
    busy(true, logoutButton);
    try {
      const { error } = await supabase.auth.signOut();
      if (error) {
        show('تعذّر تسجيل الخروج: ' + error.message, 'err');
        return;
      }
      show('تم تسجيل الخروج. اضغط الآن على زر إرسال رابط الدخول، ثم افتح أحدث رسالة في بريدك.');
    } catch (error) {
      show('حدث خطأ أثناء تسجيل الخروج: ' + (error?.message || 'خطأ غير معروف'), 'err');
    } finally {
      busy(false, logoutButton);
    }
  }

  async function handleReturn() {
    const params = new URLSearchParams(location.search);
    if (params.has('error') || params.has('error_code')) {
      show('تعذّر تسجيل الدخول: ' + (params.get('error_description') || params.get('error_code') || params.get('error')), 'err');
      history.replaceState({}, document.title, REDIRECT_URL);
      return;
    }
    try {
      const { data: { session }, error } = await supabase.auth.getSession();
      if (error) { show('تعذّر استعادة جلسة الدخول: ' + error.message, 'err'); return; }
      if (!session) return;

      show('تم التحقق من جلسة الدخول. جارٍ تفعيل حساب المالك…');
      busy(true, sendButton);
      const { data, error: invokeError } = await supabase.functions.invoke('bootstrap-nova-owner', { body: {} });
      if (invokeError) {
        let detail = invokeError.message || 'تعذّر تشغيل وظيفة التفعيل.';
        try {
          if (invokeError.context) {
            const body = await invokeError.context.json();
            if (body?.error) detail = body.error;
          }
        } catch {}
        show('لم يكتمل التفعيل: ' + detail + '\nلا ترسل رموز الدخول أو المفاتيح لأي شخص.', 'err');
        return;
      }
      if (!data?.success) {
        show('لم يكتمل التفعيل: ' + (data?.error || 'استجابة غير متوقعة.'), 'err');
        return;
      }
      show('نجح تفعيل المالك في NOVA MARKET.\nاضغط زر تسجيل الخروج، ثم أرسل رابط دخول جديد لتحديث صلاحيات الجلسة.', 'ok');
      logoutButton.hidden = false;
      history.replaceState({}, document.title, REDIRECT_URL);
    } catch (error) {
      show('حدث خطأ أثناء التحقق: ' + (error?.message || 'خطأ غير معروف'), 'err');
    } finally {
      busy(false, sendButton);
    }
  }

  sendButton.addEventListener('click', sendMagicLink);
  logoutButton.addEventListener('click', signOutOwner);
  handleReturn();
</script>
</body>
</html>
