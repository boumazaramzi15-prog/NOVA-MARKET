name: NOVA backend and storefront checks
on:
  push:
    branches: [main]
    paths: ['backend/**', '*.js', '.github/workflows/backend-ci.yml']
  pull_request:
    paths: ['backend/**', '*.js', '.github/workflows/backend-ci.yml']
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check ../store.js
      - run: node --check ../admin.js
      - run: node --check ../app.js
      - run: npm install
      - run: npm test
